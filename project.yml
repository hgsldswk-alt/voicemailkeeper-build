name: VoicemailKeeper
options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  knownRegions: [en, zh-Hans, zh-Hant]
settings:
  base:
    APP_ID: com.hgsldswk.voicemailkeeper
    APP_STORE_ID: ""
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    CLANG_CXX_LANGUAGE_STANDARD: c++14
    OTHER_CPLUSPLUSFLAGS: ["$(inherited)", "-fwrapv"]
    GCC_PREPROCESSOR_DEFINITIONS: ["$(inherited)", DISABLE_AMRNB_ENCODER=1]
    HEADER_SEARCH_PATHS:
      - $(SRCROOT)/Shared/OpenCoreAMR/oscl
      - $(SRCROOT)/Shared/OpenCoreAMR/opencore/codecs_v2/audio/gsm_amr/common/dec/include
      - $(SRCROOT)/Shared/OpenCoreAMR/opencore/codecs_v2/audio/gsm_amr/amr_nb/dec/src
      - $(SRCROOT)/Shared/OpenCoreAMR/opencore/codecs_v2/audio/gsm_amr/amr_nb/dec/include
      - $(SRCROOT)/Shared/OpenCoreAMR/opencore/codecs_v2/audio/gsm_amr/amr_nb/common/include
      - $(SRCROOT)/Shared/OpenCoreAMR/opencore/codecs_v2/audio/gsm_amr/amr_nb/enc/src
      - $(SRCROOT)/Shared/OpenCoreAMR/opencore/codecs_v2/audio/gsm_amr/amr_wb/dec/src
      - $(SRCROOT)/Shared/OpenCoreAMR/opencore/codecs_v2/audio/gsm_amr/amr_wb/dec/include
targets:
  VoicemailKeeper:
    type: application
    platform: iOS
    sources:
      - VoicemailKeeper
      - path: Shared
        excludes: [OpenCoreAMR/LICENSE, OpenCoreAMR/README.md]
      - path: Shared/OpenCoreAMR/LICENSE
        buildPhase: resources
      - path: VoicemailKeeperTests/Fixtures/Sample.m4a
        buildPhase: resources
    dependencies:
      - sdk: libsqlite3.tbd
      - sdk: libz.tbd
      - sdk: libc++.tbd
      - target: VoicemailKeeperShare
        embed: true
    entitlements:
      path: VoicemailKeeper/VoicemailKeeper.entitlements
      properties:
        com.apple.security.application-groups: [group.com.hgsldswk.voicemailkeeper]
    settings:
      base:
        SWIFT_OBJC_BRIDGING_HEADER: Shared/AMRBridge.h
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID)
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: VoicemailKeeper AppStore
          EXCLUDED_SOURCE_FILE_NAMES: Sample.m4a
    info:
      path: VoicemailKeeper/Info.plist
      properties:
        CFBundleDisplayName: Voicemail Keeper
        CFBundleDevelopmentRegion: en
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        APP_STORE_ID: $(APP_STORE_ID)
        NSFaceIDUsageDescription: Unlock your saved voice messages.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Voicemail Keeper Message
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [com.hgsldswk.voicemailkeeper.message]
        LSSupportsOpeningDocumentsInPlace: true
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.hgsldswk.voicemailkeeper.message
            UTTypeDescription: Voicemail Keeper Message
            UTTypeConformsTo: [public.data, public.content]
            UTTypeTagSpecification:
              public.filename-extension: [vkeep]
              public.mime-type: [application/vnd.voicemailkeeper.message]
  VoicemailKeeperShare:
    type: app-extension
    platform: iOS
    sources:
      - ShareExtension
      - path: Shared
        excludes: [OpenCoreAMR/LICENSE, OpenCoreAMR/README.md]
      - path: Shared/OpenCoreAMR/LICENSE
        buildPhase: resources
    dependencies:
      - sdk: libsqlite3.tbd
      - sdk: libz.tbd
      - sdk: libc++.tbd
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
      properties:
        com.apple.security.application-groups: [group.com.hgsldswk.voicemailkeeper]
    settings:
      base:
        SWIFT_OBJC_BRIDGING_HEADER: Shared/AMRBridge.h
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID).share
        TARGETED_DEVICE_FAMILY: "1"
        APPLICATION_EXTENSION_API_ONLY: YES
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: VoicemailKeeper Share AppStore
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Voicemail Keeper
        CFBundleDevelopmentRegion: en
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSFaceIDUsageDescription: Unlock your saved voice messages.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule: >-
              SUBQUERY(extensionItems, $item,
              SUBQUERY($item.attachments, $attachment,
              ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.audio" OR
              ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.mpeg-4" OR
              ANY $attachment.registeredTypeIdentifiers == "public.data" OR
              ANY $attachment.registeredTypeIdentifiers == "public.item" OR
              ANY $attachment.registeredTypeIdentifiers == "public.file-url" OR
              ANY $attachment.registeredTypeIdentifiers == "com.apple.coreaudio-format" OR
              ANY $attachment.registeredTypeIdentifiers == "org.3gpp.adaptive-multi-rate-audio")
              .@count == 1 AND $item.attachments.@count == 1).@count == 1
  VoicemailKeeperTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: VoicemailKeeperTests
        excludes: [Fixtures]
      - path: VoicemailKeeperTests/Fixtures
        type: folder
        buildPhase: resources
      - path: Shared
        excludes: [OpenCoreAMR/LICENSE, OpenCoreAMR/README.md]
    dependencies:
      - sdk: libsqlite3.tbd
      - sdk: libz.tbd
      - sdk: libc++.tbd
    settings:
      base:
        SWIFT_OBJC_BRIDGING_HEADER: Shared/AMRBridge.h
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID).tests
        GENERATE_INFOPLIST_FILE: YES
  VoicemailKeeperUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [VoicemailKeeperUITests]
    dependencies:
      - target: VoicemailKeeper
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: VoicemailKeeper
schemes:
  VoicemailKeeper:
    build:
      targets:
        VoicemailKeeper: all
        VoicemailKeeperTests: [test]
    test:
      config: Debug
      targets: [VoicemailKeeperTests]
  VoicemailKeeperUI:
    build:
      targets:
        VoicemailKeeper: all
        VoicemailKeeperUITests: [test]
    test:
      config: Debug
      targets: [VoicemailKeeperUITests]
